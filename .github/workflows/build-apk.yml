name: Build APK with PWABuilder

on:
  push:
    branches: [ feature/offline-first ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK with PWABuilder
      uses: pwa-builder/pwabuilder-action@v1
      with:
        url: 'https://www.solinet.de5.net'
        platform: 'android'
        output_path: './apk-output'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: solinet-apk
        path: './apk-output'
        if-no-files-found: error
