name: Build APK for SoliNet

on:
  push:
    branches: [ feature/offline-first ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Decodificar Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

    - name: Inicializar proyecto TWA
      run: |
        bubblewrap init \
          --manifest https://www.solinet.de5.net/manifest.json \
          --directory twa-project \
          --keyPath ../android.keystore \
          --keyAlias ${{ secrets.KEY_ALIAS }} \
          --keyPassword ${{ secrets.KEY_PASSWORD }} \
          --storePassword ${{ secrets.KEYSTORE_PASSWORD }}

    - name: Compilar APK firmado
      run: |
        cd twa-project
        bubblewrap build

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: solinet-apk
        path: twa-project/app/build/outputs/apk/release/app-release-signed.apk
