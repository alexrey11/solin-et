name: Build APK for SoliNet

on:
  push:
    branches: [ feature/offline-first ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Instalar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configurar rutas de JDK y Android SDK
      run: |
        mkdir -p ~/.bubblewrap
        cat > ~/.bubblewrap/config.json << EOF
        {
          "jdkPath": "${JAVA_HOME}",
          "androidSdkPath": "${ANDROID_HOME}"
        }
        EOF
        echo "=== Config guardada ==="
        cat ~/.bubblewrap/config.json
        echo "=== JAVA_HOME: $JAVA_HOME ==="
        echo "=== ANDROID_HOME: $ANDROID_HOME ==="

    - name: Decodificar Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

    - name: Inicializar proyecto TWA
      run: |
        bubblewrap init \
          --manifest https://www.solinet.de5.net/manifest.json \
          --directory twa-project \
          --appVersionName 1.0.0 \
          --appVersionCode 1 \
          --keyPath ../android.keystore \
          --keyAlias ${{ secrets.KEY_ALIAS }} \
          --keyPassword ${{ secrets.KEY_PASSWORD }} \
          --storePassword ${{ secrets.KEYSTORE_PASSWORD }} \
          --skipPwaValidation

    - name: Compilar APK firmado
      run: |
        cd twa-project
        bubblewrap build

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: solinet-apk
        path: twa-project/app/build/outputs/apk/release/app-release-signed.apk
        if-no-files-found: error
